name: Mission 032 hardening

on:
  pull_request:
  push:
    branches: [main, mission-032-zip-frontend-backend-integration]

permissions:
  contents: read

jobs:
  canonical-python-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run canonical AEGIS tests
        run: PYTHONPATH=src:. pytest -q tests/unit tests/integration
      - name: Verify immutable evidence fingerprints
        run: python .github/scripts/verify_evidence_integrity.py
      - name: Scan tracked text for credential literals
        run: python .github/scripts/scan_tracked_secrets.py

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      AEGIS_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Run adapter and web tests
        run: pnpm test
      - name: Type-check web application
        run: pnpm check
      - name: Build production web application
        run: pnpm build
